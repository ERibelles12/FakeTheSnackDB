#Business errors
MIN_SIZE_ID_NOMBRE_ERROR 						= 00001 : Field Name too short.
REQUIRED_ID_NOMBRE_ERROR 						= 00002 : Field Name required.
REQUIRED_DESCRIPCION_ERROR						= 00003 : Field Description requierd.
MIN_SIZE_DESCRIPCION_ERROR						= 00004 : Field Description too short.
NOT_FOUND_ERROR 								= 00005 : Register not found. 
DUPLICATED_ERROR 								= 00006 : Duplicated register.
NOT_FOUND_REGISTER_LIST_ERROR 					= 00007 : Not found registers.
REQUIRED_PARAMETERS_ERROR 		                = 00008 : Parameters required.
REQUIRED_ID_ERROR                               = 00009 : Field id required.
REQUIRED_ID_PRODUCT_ERROR                       = 00010 : Field product Id required.
NOT_FOUND_PRODUCT                               = 00011 : Product not found.
REQUIRED_ID_INGREDIENT_ERROR                    = 00012 : Field ingredient Id required.
NOT_FOUND_INGREDIENT                            = 00013 : Ingredient not found.
REQUIRED_RECIPE_ID_ERROR                        = 00014 : Recipe between Product and Ingredient required.
NOT_FOUND_RECIPE_ID_ERROR                       = 00015 : Recipe not found
NOT_RECIPE_PRODUCT_ERROR                        = 00016 : Relation between Product and Recipe not exist.
NOT_RECIPE_INGREDIENT_ERROR                     = 00017 : Relation between Ingredient and Recipe not exist.
REQUIRED_INGREDIENT_MEAN_PERCENTAGE_ERROR       = 00018 : Ingredient mean percentaje required.
REQUIRED_INGREDIENT_STD_PERCENTAGE_ERROR        = 00019 : Ingredient std percentaje requiered.
